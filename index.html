<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest">
<title>أعلام ترفرف • Waving Flags</title>
<style>
  :root{
    --bg:#0b1020; --panel:#141c33; --panel2:#1b2542; --line:#2c3a63;
    --txt:#f2f5ff; --mut:#a9b4d4; --acc:#ffcf4d; --acc2:#4dd2ff; --ok:#37d67a; --bad:#ff5d6c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1c2a55 0%,var(--bg) 60%);color:var(--txt);
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
  .wrap{max-width:1060px;margin:0 auto;padding:18px 14px 40px}
  header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .logo{font-size:42px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
  h1{font-size:clamp(22px,4vw,34px);margin:0;background:linear-gradient(90deg,var(--acc),#ff9d4d 40%,var(--acc2));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--mut);margin:2px 0 12px;font-size:clamp(13px,2.4vw,16px)}
  .netStatus{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;color:var(--mut);font-size:13px;margin:0 0 10px}
  .netStatus::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .netStatus.offline::before{background:var(--bad)}
  #langBtn{margin-inline-start:auto;background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:999px;padding:8px 18px;font-size:15px;cursor:pointer}
  #langBtn:hover{border-color:var(--acc)}
  .tabs{display:flex;gap:10px;margin:10px 0 14px}
  .tabs button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
    color:var(--txt);font-size:17px;cursor:pointer}
  .tabs button.on{background:linear-gradient(180deg,#2b3a6b,#1b2542);border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
  .panel{background:rgba(20,28,51,.75);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .searchRow{display:flex;gap:10px;flex-wrap:wrap}
  #countryInput{flex:1;min-width:200px;padding:13px 14px;font-size:17px;border-radius:12px;border:1px solid var(--line);
    background:#0e1530;color:var(--txt)}
  .btn{background:linear-gradient(180deg,#3a5bd9,#2a44ad);color:#fff;border:none;border-radius:12px;
    padding:13px 22px;font-size:17px;cursor:pointer}
  .btn:hover{filter:brightness(1.12)}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line)}
  #searchErr{color:var(--bad);min-height:22px;margin-top:8px;font-size:15px}

  /* المسرح: اتجاه ثابت LTR كي تبقى السارية يسارًا والعلم يرفرف يمينًا */
  .stage{position:relative;direction:ltr;border-radius:18px;overflow:hidden;border:1px solid var(--line);
    aspect-ratio:16/10;min-height:340px;background:linear-gradient(180deg,#27407c 0%,#3f6db3 45%,#9fc3e8 75%,#e8d9b0 100%)}
  #lmImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s}
  #lmImg.show{opacity:1}
  .noimg{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:20px;
    font-size:90px;opacity:.35}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,10,30,.25) 0%,transparent 35%,transparent 55%,rgba(5,10,30,.55) 100%)}
  #flagCanvas{position:absolute;inset:0;width:100%;height:100%}
  .pole{position:absolute;top:5%;bottom:0;left:34px;width:12px;border-radius:8px;
    background:linear-gradient(90deg,#6b7488,#e8edf7 40%,#8a93a8 70%,#4c5468);box-shadow:3px 4px 10px rgba(0,0,0,.45)}
  .ball{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--acc) 45%,#8a6a00 100%);box-shadow:0 0 12px rgba(255,207,77,.8)}
  .spin{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;
    border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .caption{position:absolute;bottom:12px;left:12px;background:rgba(5,10,25,.72);backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 14px;font-size:15px;max-width:75%}
  .caption a{color:var(--acc2);font-size:13px;margin-inline-start:8px}
  .anthemChip{position:absolute;top:12px;left:70px;display:flex;align-items:center;gap:10px;
    background:rgba(5,10,25,.72);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 14px 6px 6px;max-width:calc(100% - 150px)}
  #anthemBtn{flex:none;width:42px;height:42px;border-radius:50%;border:none;font-size:18px;cursor:pointer;
    background:linear-gradient(180deg,var(--acc),#e09b00);color:#231a00}
  #anthemName{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .eq{flex:none;display:flex;align-items:flex-end;gap:3px;height:22px;width:30px}
  .eq i{flex:1;background:var(--acc2);border-radius:2px;height:4px}
  .eq.play i{animation:eq .7s ease-in-out infinite alternate}
  .eq.play i:nth-child(2){animation-delay:.15s}.eq.play i:nth-child(3){animation-delay:.3s}
  .eq.play i:nth-child(4){animation-delay:.45s}.eq.play i:nth-child(5){animation-delay:.6s}
  @keyframes eq{from{height:4px}to{height:22px}}
  .anthemBar{display:flex;gap:10px;align-items:center;margin-top:10px}
  #anthemAudio{flex:1;min-width:0}
  .info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px}
  .card{background:rgba(20,28,51,.8);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .card .k{font-size:13px;color:var(--mut);margin-bottom:4px}
  .card .v{font-size:19px;font-weight:700}
  .card.fact .v{font-size:15px;font-weight:400;line-height:1.7}
  .windRow{display:flex;align-items:center;gap:12px;margin-top:12px;color:var(--mut);font-size:15px;flex-wrap:wrap}
  .windRow input[type=range]{flex:1;min-width:130px}
  input[type=range]{accent-color:var(--acc)}
  .scoreRow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:15px}
  .pill b{color:var(--acc)}
  #quizQ{font-size:19px;font-weight:700;margin:6px 0 12px}
  #quizOpts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){#quizOpts{grid-template-columns:1fr}}
  @media(max-width:560px){.stage{aspect-ratio:4/5;min-height:0}}
  #quizOpts button{padding:14px;border-radius:12px;border:1px solid var(--line);background:#0e1530;color:var(--txt);
    font-size:17px;cursor:pointer;line-height:1.5}
  #quizOpts button small{display:block;font-size:13px;color:var(--mut)}
  #quizOpts button:not(:disabled):hover{border-color:var(--acc2)}
  #quizOpts button.right{background:rgba(55,214,122,.18);border-color:var(--ok)}
  #quizOpts button.wrong{background:rgba(255,93,108,.18);border-color:var(--bad)}
  #quizFb{min-height:30px;margin:10px 0;font-size:16px;line-height:1.7}
  footer{margin-top:22px;color:var(--mut);font-size:13px;line-height:2;text-align:center}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">🎌</div>
    <div><h1 data-i18n="title">أعلام ترفرف</h1></div>
    <button id="langBtn">English 🌐</button>
  </header>
  <p class="sub" data-i18n="subtitle"></p>
  <div class="netStatus" id="netStatus" role="status" aria-live="polite"></div>

  <nav class="tabs">
    <button id="tabExplore" class="on">🔍 <span data-i18n="explore"></span></button>
    <button id="tabQuiz">🎮 <span data-i18n="quiz"></span></button>
  </nav>

  <section class="panel" id="explorePanel">
    <div class="searchRow">
      <input id="countryInput" list="countryList" data-i18n-ph="searchPh" autocomplete="off">
      <datalist id="countryList"></datalist>
      <button class="btn" id="showBtn" data-i18n="show"></button>
      <button class="btn ghost" id="randomBtn" data-i18n="random"></button>
    </div>
    <div id="searchErr"></div>
  </section>

  <section class="panel hidden" id="quizPanel">
    <div class="scoreRow">
      <span class="pill">⭐ <span data-i18n="score"></span>: <b id="qScore">0</b></span>
      <span class="pill">🔥 <span data-i18n="streak"></span>: <b id="qStreak">0</b></span>
      <span class="pill">🏆 <span data-i18n="best"></span>: <b id="qBest">0</b></span>
    </div>
    <p id="quizQ"></p>
    <div id="quizOpts"></div>
    <div id="quizFb"></div>
    <button class="btn hidden" id="quizNext" data-i18n="next"></button>
  </section>

  <section class="stage" id="stage">
    <img id="lmImg" alt="">
    <div class="noimg hidden" id="noImg">🏞️</div>
    <div class="shade"></div>
    <canvas id="flagCanvas"></canvas>
    <div class="pole"><div class="ball"></div></div>
    <div class="spin hidden" id="imgSpin"></div>
    <div class="anthemChip">
      <button id="anthemBtn" title="play">▶</button>
      <div class="eq" id="eq"><i></i><i></i><i></i><i></i><i></i></div>
      <span id="anthemName" dir="auto">…</span>
    </div>
    <div class="caption">📍 <span id="lmName" dir="auto">…</span><a id="wikiLink" href="#" target="_blank" rel="noopener">Wikipedia</a></div>
  </section>

  <div class="anthemBar">
    <audio id="anthemAudio" controls preload="auto"></audio>
  </div>

  <section class="info" id="infoCard">
    <div class="card"><div class="k" data-i18n="country"></div><div class="v" id="cName">…</div></div>
    <div class="card"><div class="k" data-i18n="capital"></div><div class="v" id="cCap">…</div></div>
    <div class="card"><div class="k" data-i18n="landmark"></div><div class="v" id="cLm">…</div></div>
    <div class="card fact"><div class="k" data-i18n="fact"></div><div class="v" id="cFact">…</div></div>
  </section>

  <div class="windRow">
    <span>🌬️ <span data-i18n="wind"></span></span>
    <input type="range" id="windRange" min="0" max="2" step="0.1" value="1">
    <span>🫧 <span data-i18n="alpha"></span></span>
    <input type="range" id="alphaRange" min="40" max="100" step="1" value="85">
  </div>

  <footer>
    <span data-i18n="credit"></span><br>
    <span data-i18n="tip"></span>
  </footer>
</div>

<script>

    notFound:"لم أجد هذه الدولة! جرّب: مصر، السعودية، اليابان، فرنسا…",
    credit:"الأعلام: flagcdn.com • الأناشيد: jsDelivr / nationalanthems.info • الصور: ويكيبيديا",
    tip:"اكتب بالعربية أو الإنجليزية — مثال: المغرب، تركيا، Japan، Brazil",
    qMode:"وضع الاختبار: الاسم مخفي!", anthemQ:"نشيد دولة… أي دولة؟ 🎵",
    onlineStatus:"متصل — تُحفظ الموارد التي تزورها لاستخدامها دون اتصال", offlineStatus:"دون اتصال — تظهر الموارد التي سبق تحميلها فقط" },
  en:{ title:"Waving Flags", subtitle:"Type any country to see its flag waving over its top landmark while its anthem plays",
    explore:"Explore", quiz:"Quiz", searchPh:"Type a country… e.g. Egypt, Japan, France",
    show:"Show", random:"🎲 Random", country:"Country", capital:"Capital", landmark:"Top landmark",
    fact:"Did you know?", wind:"Wind strength", alpha:"Flag transparency", score:"Score", streak:"Streak", best:"Best",
    next:"Next ⏭", guessQ:"Which country is this? 🤔 Guess from the flag, landmark and anthem!",
    correct:"🎉 Correct! Well done!", wrong:"❌ Wrong! The answer is:", anthemOf:"National anthem",
    notFound:"Country not found! Try: Egypt, Japan, France, Brazil…",
    credit:"Flags: flagcdn.com • Anthems: jsDelivr / nationalanthems.info • Photos: Wikipedia",
    tip:"Type in Arabic or English — e.g. Morocco, Türkiye, Japan, Brazil",
    qMode:"Quiz mode: name hidden!", anthemQ:"An anthem… of which country? 🎵",
    onlineStatus:"Online — visited resources are saved for offline use", offlineStatus:"Offline — only previously loaded resources are available" }
};
var lang="ar";
try{ lang=localStorage.getItem("wflag_lang")||"ar"; }catch(e){}
if(lang!=="ar"&&lang!=="en") lang="ar";
function t(k){ return (STR[lang]&&STR[lang][k])||STR.en[k]||k; }
function updateNetworkStatus(){
  var status=document.getElementById("netStatus");
  if(!status) return;
  var online=navigator.onLine;
  status.textContent=t(online?"onlineStatus":"offlineStatus");
  status.classList.toggle("offline",!online);
}
window.addEventListener("online",updateNetworkStatus);
window.addEventListener("offline",updateNetworkStatus);

var $=function(id){return document.getElementById(id);};
var input=$("countryInput"), list=$("countryList"), err=$("searchErr"),
    lmImg=$("lmImg"), noImg=$("noImg"), spin=$("imgSpin"), canvas=$("flagCanvas"), ctx=canvas.getContext("2d"),
    audio=$("anthemAudio"), eq=$("eq"), anthemBtn=$("anthemBtn"), anthemName=$("anthemName"),
    lmName=$("lmName"), wikiLink=$("wikiLink"),
    cName=$("cName"), cCap=$("cCap"), cLm=$("cLm"), cFact=$("cFact"),
    quizPanel=$("quizPanel"), explorePanel=$("explorePanel"),
    tabExplore=$("tabExplore"), tabQuiz=$("tabQuiz"),
    qScore=$("qScore"), qStreak=$("qStreak"), qBest=$("qBest"),
    quizQ=$("quizQ"), quizOpts=$("quizOpts"), quizFb=$("quizFb"), quizNext=$("quizNext");
var mode="explore", current=null, wind=1, flagAlpha=0.85,
    q={score:0,streak:0,best:0,cur:null,opts:[],answered:false};
try{ q.best=parseInt(localStorage.getItem("wflag_best")||"0",10)||0; }catch(e){}

/* ================= البحث ================= */
function norm(s){
  return (s||"").toLowerCase()
    .replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي")
    .replace(/[^a-z0-9\u0600-\u06FF ]/g," ").replace(/\s+/g," ").trim();
}
function findCountry(text){
  var n=norm(text); if(!n) return null;
  var i,c;
  for(var a in ALIAS){ if(norm(a)===n){ for(i=0;i<COUNTRIES.length;i++) if(COUNTRIES[i].iso===ALIAS[a]) return COUNTRIES[i]; } }
  for(i=0;i<COUNTRIES.length;i++){ c=COUNTRIES[i];
    if(norm(c.ar)===n||norm(c.en)===n||c.iso===n) return c; }
  if(n.length<2) return null;
  for(i=0;i<COUNTRIES.length;i++){ c=COUNTRIES[i];
    if(norm(c.ar).indexOf(n)===0||norm(c.en).indexOf(n)===0) return c; }
  for(i=0;i<COUNTRIES.length;i++){ c=COUNTRIES[i];
    if(norm(c.ar).indexOf(n)>=0||norm(c.en).indexOf(n)>=0) return c; }
  return null;
}

function applyLang(){
  updateNetworkStatus();
  document.documentElement.dir=(lang==="ar")?"rtl":"ltr";
  document.documentElement.lang=lang;
  var els=document.querySelectorAll("[data-i18n]");
  for(var i=0;i<els.length;i++) els[i].textContent=t(els[i].getAttribute("data-i18n"));
  var ph=document.querySelectorAll("[data-i18n-ph]");
  for(var j=0;j<ph.length;j++) ph[j].placeholder=t(ph[j].getAttribute("data-i18n-ph"));
  $("langBtn").textContent=(lang==="ar")?"English 🌐":"عربي 🌐";
  list.innerHTML="";
  COUNTRIES.forEach(function(c){
    var o=document.createElement("option"); o.value=(lang==="ar")?c.ar:c.en; list.appendChild(o);
  });
  qBest.textContent=q.best; qScore.textContent=q.score; qStreak.textContent=q.streak;
  if(current) renderInfo();
  if(mode==="quiz"&&q.cur) renderQuizQ();
}

/* ================= العلم المتموج ================= */
var flagImg=new Image(), flagReady=false;
flagImg.onload=function(){flagReady=true;};
flagImg.onerror=function(){flagReady=false;};
function sizeCanvas(){
  var r=canvas.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.max(2,Math.round(r.width*dpr));
  canvas.height=Math.max(2,Math.round(r.height*dpr));
}
window.addEventListener("resize",sizeCanvas);
var waveT=0;
function drawFlag(dt){
  waveT+=dt;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!flagReady||!flagImg.naturalWidth) return;
  var W=canvas.width,H=canvas.height, rect=canvas.getBoundingClientRect();
  var k=rect.width?W/rect.width:1;
  var iw=flagImg.naturalWidth, ih=flagImg.naturalHeight;
  var s=Math.min(W*0.55/iw,H*0.42/ih), fw=iw*s, fh=ih*s;
  var px=(34+6)*k, y0=H*0.075;
  var N=110, sw=iw/N, dw=fw/N;
  ctx.save(); ctx.globalAlpha=flagAlpha;
  for(var i=0;i<N;i++){
    var p=i/(N-1);
    var off=(Math.sin(i*0.30+waveT*4.2)*0.045+Math.sin(i*0.12-waveT*2.3)*0.03)*fh*wind*p;
    var dx=px+dw*i, dy=y0+off;
    ctx.drawImage(flagImg,i*sw,0,sw,ih,dx,dy,dw+1,fh);
    var sh=(Math.sin(i*0.30+waveT*4.2+1.1)+1)/2;
    ctx.fillStyle="rgba(0,0,30,"+(0.30*sh*wind+0.04).toFixed(3)+")";
    ctx.fillRect(dx,dy,dw+1,fh);
    ctx.fillStyle="rgba(255,255,255,"+(0.10*(1-sh)*wind).toFixed(3)+")";
    ctx.fillRect(dx,dy,dw+1,fh);
  }
  ctx.restore();
}
var lastT=0;
function loop(ts){
  var dt=Math.min(0.05,(ts-lastT)/1000||0.016); lastT=ts;
  drawFlag(dt); requestAnimationFrame(loop);
}

/* ================= النشيد ================= */
var NO_JSD={ye:1,ps:1,tn:1,ir:1,vn:1,ng:1,et:1,fi:1}, actSrc=0, stallTimer=null;
function anthemURL(c,which){
  var jd="https://cdn.jsdelivr.net/gh/open-assets-hub/national-anthems@main/anthems/"+c.iso+"/anthem.mp3";
  var na="https://nationalanthems.info/"+c.iso+".mp3";
  var primaryIsJd=!NO_JSD[c.iso];
  if(which===0) return primaryIsJd?jd:na;
  return primaryIsJd?na:jd;
}
function tryPlay(){ try{var p=audio.play();if(p&&p.catch)p.catch(function(){});}catch(e){} }
function useFallback(auto){
  if(!current||actSrc!==0) return;
  actSrc=1; audio.src=anthemURL(current,1); audio.load();
  if(!auto) tryPlay();
}
function armStallWatch(){
  if(stallTimer) clearTimeout(stallTimer);
  stallTimer=setTimeout(function(){
    if(current&&actSrc===0&&audio.networkState===2&&audio.readyState<2) useFallback(true);
  },12000);
}
audio.addEventListener("error",function(){ useFallback(false); });
audio.addEventListener("play",function(){eq.classList.add("play");anthemBtn.textContent="⏸";});
audio.addEventListener("pause",function(){eq.classList.remove("play");anthemBtn.textContent="▶";});
anthemBtn.onclick=function(){ if(audio.paused) tryPlay(); else audio.pause(); };

/* ================= صورة المعلم (من ويكيبيديا) ================= */
var imgToken=0, imgCache={};
function showImg(url,fallbackUrl,token){
  lmImg.onload=function(){ if(token!==imgToken) return; spin.classList.add("hidden"); noImg.classList.add("hidden"); lmImg.classList.add("show"); };
  lmImg.onerror=function(){
    if(token!==imgToken) return;
    if(fallbackUrl&&lmImg.src!==fallbackUrl){ lmImg.src=fallbackUrl; return; }
    spin.classList.add("hidden"); noImg.classList.remove("hidden");
  };
  lmImg.src=url;
}
function loadLandmark(c){
  var token=++imgToken;
  spin.classList.remove("hidden"); lmImg.classList.remove("show"); noImg.classList.add("hidden");
  if(imgCache[c.wiki]){ showImg(imgCache[c.wiki][0],imgCache[c.wiki][1],token); return; }
  var api="https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(c.wiki);
  fetch(api).then(function(r){ if(!r.ok) throw new Error("http"); return r.json(); }).then(function(j){
    var small=(j.thumbnail&&j.thumbnail.source)||(j.originalimage&&j.originalimage.source);
    if(!small) throw new Error("noimg");
    var big=small.replace(/\/\d+px-/,"/1280px-");
    imgCache[c.wiki]=[big,small];
    if(token===imgToken) showImg(big,small,token);
  }).catch(function(){
    if(token!==imgToken) return;
    spin.classList.add("hidden"); noImg.classList.remove("hidden");
  });
}

/* ================= عرض المشهد ================= */
function loadScene(c){
  current=c; actSrc=0;
  loadLandmark(c);
  flagReady=false;
  flagImg.src="https://flagcdn.com/w640/"+c.iso+".png";
  try{audio.pause();}catch(e){}
  audio.src=anthemURL(c,0); audio.load(); armStallWatch();
  renderInfo();
}
function renderInfo(){
  if(!current) return;
  var hide=(mode==="quiz"&&!q.answered);
  if(hide){
    cName.textContent="؟؟؟ ???"; cCap.textContent="؟؟؟ ???"; cLm.textContent="؟؟؟ ???";
    cFact.textContent=t("qMode"); lmName.textContent="؟؟؟ ???";
    anthemName.textContent="🎵 "+t("anthemQ"); lmImg.alt="???";
    wikiLink.classList.add("hidden");
  }else{
    cName.textContent=current.ar+" • "+current.en;
    cCap.textContent=current.cap_ar+" • "+current.cap_en;
    cLm.textContent=current.lm_ar+" • "+current.lm_en;
    cFact.textContent=(lang==="ar")?current.fact_ar:current.fact_en;
    lmName.textContent=(lang==="ar")?current.lm_ar:current.lm_en;
    anthemName.textContent="🎵 "+t("anthemOf")+": "+((lang==="ar")?current.ar:current.en);
    lmImg.alt=current.en;
    wikiLink.href="https://en.wikipedia.org/wiki/"+encodeURIComponent(current.wiki);
    wikiLink.classList.remove("hidden");
  }
}
function doShow(){
  var c=findCountry(input.value);
  if(!c){ err.textContent="❓ "+t("notFound"); input.focus(); return; }
  err.textContent=""; loadScene(c); setTimeout(tryPlay,400);
}
function doRandom(){
  var c=COUNTRIES[Math.floor(Math.random()*COUNTRIES.length)];
  input.value=(lang==="ar")?c.ar:c.en; err.textContent="";
  loadScene(c); setTimeout(tryPlay,400);
}

/* ================= الاختبار ================= */
function setMode(m){
  mode=m;
  tabExplore.classList.toggle("on",m==="explore");
  tabQuiz.classList.toggle("on",m==="quiz");
  explorePanel.classList.toggle("hidden",m!=="explore");
  quizPanel.classList.toggle("hidden",m!=="quiz");
  if(m==="quiz"){ nextQuestion(); }
  else { renderInfo(); }
}
function nextQuestion(){
  var idx=Math.floor(Math.random()*COUNTRIES.length);
  q.cur=COUNTRIES[idx]; q.answered=false;
  var pool=COUNTRIES.slice(); pool.splice(idx,1);
  var opts=[q.cur];
  while(opts.length<4){ var k=Math.floor(Math.random()*pool.length); opts.push(pool.splice(k,1)[0]); }
  for(var i=opts.length-1;i>0;i--){ var r=Math.floor(Math.random()*(i+1)); var tmp=opts[i]; opts[i]=opts[r]; opts[r]=tmp; }
  q.opts=opts;
  quizNext.classList.add("hidden"); quizFb.textContent="";
  loadScene(q.cur); setTimeout(tryPlay,400);
  renderQuizQ();
}
function renderQuizQ(){
  quizQ.textContent=t("guessQ");
  quizOpts.innerHTML="";
  q.opts.forEach(function(c){
    var b=document.createElement("button");
    b.textContent=(lang==="ar")?c.ar:c.en;
    var s=document.createElement("small"); s.textContent=(lang==="ar")?c.en:c.ar; b.appendChild(s);
    b.onclick=function(){answer(c,b);};
    if(q.answered){ b.disabled=true; if(c.iso===q.cur.iso) b.classList.add("right"); }
    quizOpts.appendChild(b);
  });
}
function answer(c,btn){
  if(q.answered) return; q.answered=true;
  var kids=quizOpts.children, ok=(c.iso===q.cur.iso), i;
  for(i=0;i<kids.length;i++) kids[i].disabled=true;
  quizFb.textContent="";
  var l1=document.createElement("div"), l2=document.createElement("div");
  if(ok){
    btn.classList.add("right"); q.score++; q.streak++;
    l1.textContent=t("correct");
    l2.textContent="🌍 "+q.cur.ar+" • "+q.cur.en+" — "+((lang==="ar")?q.cur.fact_ar:q.cur.fact_en);
  }else{
    btn.classList.add("wrong"); q.streak=0;
    for(i=0;i<kids.length;i++) if(q.opts[i].iso===q.cur.iso) kids[i].classList.add("right");
    l1.textContent=t("wrong")+" "+q.cur.ar+" • "+q.cur.en;
    l2.textContent="📍 "+((lang==="ar")?q.cur.lm_ar:q.cur.lm_en);
  }
  quizFb.appendChild(l1); quizFb.appendChild(l2);
  if(q.score>q.best){ q.best=q.score; try{localStorage.setItem("wflag_best",String(q.best));}catch(e){} }
  qScore.textContent=q.score; qStreak.textContent=q.streak; qBest.textContent=q.best;
  quizNext.classList.remove("hidden"); renderInfo();
}

/* ================= الربط ================= */
$("showBtn").onclick=doShow;
$("randomBtn").onclick=doRandom;
input.addEventListener("keydown",function(e){ if(e.key==="Enter") doShow(); });
input.addEventListener("change",function(){ if(findCountry(input.value)) doShow(); });
tabExplore.onclick=function(){setMode("explore");};
tabQuiz.onclick=function(){setMode("quiz");};
quizNext.onclick=nextQuestion;
$("langBtn").onclick=function(){
  lang=(lang==="ar")?"en":"ar";
  try{localStorage.setItem("wflag_lang",lang);}catch(e){}
  applyLang();
  var c=current; if(c&&mode==="explore") input.value=(lang==="ar")?c.ar:c.en;
};
$("windRange").oninput=function(e){wind=parseFloat(e.target.value);};
$("alphaRange").oninput=function(e){flagAlpha=parseFloat(e.target.value)/100;};

applyLang(); sizeCanvas(); requestAnimationFrame(loop); setTimeout(sizeCanvas,300);
var first=COUNTRIES[Math.floor(Math.random()*COUNTRIES.length)];
input.value=(lang==="ar")?first.ar:first.en;
loadScene(first);
})();
</script>
